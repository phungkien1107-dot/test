<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gian hàng hội chợ Ong Nhỏ</title>
<style>
:root{--honey:#f5b82e;--gold:#d99112;--brown:#5c3821;--cream:#fff9e9;--paper:#fffdf7;--line:#e6d6aa;--red:#bd3a2d;--green:#34724b}*{box-sizing:border-box}body{margin:0;color:var(--brown);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--cream);background-image:radial-gradient(circle at 20px 17px,#f3df9b 1px,transparent 1.5px);background-size:34px 30px}header{background:var(--brown);color:#fff7db;padding:22px max(18px,calc((100% - 1120px)/2));border-bottom:5px solid var(--honey)}h1{margin:0;font-size:clamp(22px,4vw,32px)}header p{margin:4px 0 0;color:#f5d878}.bee{display:inline-block;margin-right:8px}.wrap{max-width:1120px;margin:auto;padding:18px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid #c58c1d;background:#fff3c6;color:var(--brown);font:inherit;font-weight:700;border-radius:10px;padding:10px 14px;cursor:pointer}.tab.active{background:var(--honey);border-color:var(--gold)}.panel{display:none}.panel.active{display:block}.card{background:rgba(255,253,247,.96);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #7d521113}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 10px}.hint,.formula,.note{color:#735b42;font-size:13px}.formula{background:#fff4ca;padding:9px 11px;border-radius:8px;margin:10px 0}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 12px;font-weight:700;background:var(--honey);color:#43280f}button:hover{background:#e9a719}button.secondary{background:#f4e8c7;border:1px solid #d7bc77}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}table{border-collapse:collapse;width:100%;min-width:780px}th,td{padding:9px 8px;border-bottom:1px solid #eee3c6;text-align:left;vertical-align:top}th{background:#fff4cf;font-size:13px;white-space:nowrap}tr:last-child td{border-bottom:0}.field{min-width:116px}.input-row{display:flex;align-items:center;gap:4px}.input-row input{width:100%;min-width:0}.unit{white-space:nowrap;color:#70563d;font-size:13px}input,select{font:inherit;border:1px solid #cdbb91;border-radius:6px;padding:7px;background:#fff;width:100%;color:var(--brown)}input:focus,select:focus{outline:2px solid #f3cb5d;border-color:var(--gold)}input.invalid{border-color:var(--red);outline-color:#eb938a}.error{display:block;color:var(--red);font-size:12px;max-width:145px;margin-top:3px}.warning{display:block;color:#9b6200;font-size:12px;max-width:145px;margin-top:3px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px}.metric{padding:12px;background:#fff7dd;border:1px solid #ecd99b;border-radius:9px}.metric b{display:block;font-size:19px;color:#51311c}.metric span{font-size:13px}.break{background:#fff1bc;border-left:5px solid var(--honey);padding:12px;border-radius:7px;margin-top:12px}.sales-form{display:grid;grid-template-columns:1fr 180px auto;gap:10px;align-items:start;max-width:650px}.scenarios{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.scenario{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fffdf7}.scenario h3{color:#8b570d}.scenario .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.scenario .metric{padding:9px}.scenario table{min-width:450px;font-size:13px}.empty{color:#7d6b5d}.toast{position:fixed;z-index:10;right:18px;bottom:18px;background:#49301e;color:white;padding:12px 15px;border-radius:8px;box-shadow:0 4px 16px #0003;display:none}.toast.show{display:block}.toast.error{background:#9e3028}.summary{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.confirm{color:#8d331e;font-weight:600;font-size:13px}@media(max-width:620px){.wrap{padding:12px}.card{padding:13px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.sales-form{grid-template-columns:1fr}.scenarios{grid-template-columns:1fr}.tab{flex:1 1 100%;text-align:left}.scenario .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
body{overflow-x:hidden}header,header p,.wrap,.panel,.card,.table-wrap{max-width:100%}header p{overflow-wrap:anywhere}.wrap,.panel,.card,.table-wrap{width:100%}.card,.table-wrap{min-width:0}button{min-height:44px}.overview-metrics{grid-template-columns:repeat(4,minmax(150px,1fr))}.overview-section{margin-top:18px}.chart-groups{display:grid;grid-template-columns:repeat(3,minmax(160px,1fr));gap:14px}.chart-group{background:#fff8df;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.chart-bars{height:170px;display:flex;justify-content:center;gap:12px;position:relative;border-bottom:1px solid #b99e68}.chart-bars:before{content:"";position:absolute;left:4px;right:4px;top:50%;border-top:1px dashed #b99e68}.bar-slot{height:100%;width:42px;position:relative}.bar-fill{position:absolute;left:0;right:0;border-radius:6px 6px 0 0;min-height:2px}.bar-fill.positive{bottom:50%;background:#d99112}.bar-fill.negative{top:50%;background:#bd3a2d;border-radius:0 0 6px 6px}.bar-label{display:block;font-size:12px;margin-top:6px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:#735b42}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:#d99112;margin-right:4px;vertical-align:-1px}.legend i.base{background:#5c3821}.ranking-table{min-width:660px}@media(max-width:620px){.overview-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.chart-groups{grid-template-columns:1fr}.chart-bars{height:130px}}
.scenario{min-width:0}
</style>
</head>
<body>
<header><h1><span class="bee">🐝</span>Gian hàng hội chợ Ong Nhỏ</h1><p>Rehearsal bảng Kinh tế · Lập kế hoạch bán hàng đơn giản, rõ ràng</p></header>
<main class="wrap">
<nav class="tabs" aria-label="Nội dung"><button class="tab active" data-tab="overview">Tổng quan</button><button class="tab" data-tab="products">Sản phẩm &amp; bán thử</button><button class="tab" data-tab="costs">Chi phí &amp; hòa vốn</button><button class="tab" data-tab="scenarios">Kịch bản kinh doanh</button></nav>
<section id="overview" class="panel active"></section><section id="products" class="panel"></section><section id="costs" class="panel"></section><section id="scenarios" class="panel"></section>
</main><div id="toast" class="toast" role="status"></div>
<script>
const KEY='ong-nho-hoi-cho-v1';
const sample=()=>({products:[{name:'Trà chanh',price:20000,cost:8000,qty:80},{name:'Cacao đá',price:25000,cost:11000,qty:55},{name:'Bánh quy gói',price:15000,cost:7000,qty:60}],fixed:[{name:'Thuê gian',amount:300000},{name:'Trang trí',amount:150000},{name:'Vật tư dự phòng',amount:100000}],scenarios:[{name:'Thận trọng',visitors:100,rate:55},{name:'Cơ sở',visitors:150,rate:65}],orders:[]});
let state=load(); let lastValid={};
function validNumber(n){return Number.isSafeInteger(n)&&n>=0}
function validState(x){return x&&Array.isArray(x.products)&&x.products.length===3&&x.products.every(p=>p&&typeof p.name==='string'&&validNumber(p.price)&&validNumber(p.cost)&&validNumber(p.qty))&&Array.isArray(x.fixed)&&x.fixed.length===3&&x.fixed.every(f=>f&&typeof f.name==='string'&&validNumber(f.amount))&&Array.isArray(x.scenarios)&&x.scenarios.length===2&&x.scenarios.every(s=>s&&typeof s.name==='string'&&validNumber(s.visitors)&&validNumber(s.rate)&&s.rate<=100)&&Array.isArray(x.orders)&&x.orders.every(o=>o&&typeof o.name==='string'&&validNumber(o.qty)&&validNumber(o.revenue))}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(!validState(x))throw 0;return x}catch(e){return sample()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function money(n){return Number.isSafeInteger(Math.round(n))?Math.round(n).toLocaleString('vi-VN'):'—'}
function val(n){return Number.isFinite(n)?n:null}
function calc(){let p=state.products, good=p.every(x=>Number.isFinite(x.price)&&Number.isFinite(x.cost)&&Number.isFinite(x.qty)&&x.price>=0&&x.cost>=0&&x.qty>=0);let f=state.fixed.every(x=>Number.isFinite(x.amount)&&x.amount>=0);if(!good||!f)return null;let revenue=p.reduce((s,x)=>s+x.price*x.qty,0),variable=p.reduce((s,x)=>s+x.cost*x.qty,0),fixed=state.fixed.reduce((s,x)=>s+x.amount,0),total=p.reduce((s,x)=>s+x.qty,0),contrib=revenue-variable,avg=total>0?contrib/total:null,be=avg>0?Math.ceil(fixed/avg):null;return{revenue,variable,fixed,profit:revenue-variable-fixed,total,contrib,avg,be}}
function input(v,path,unit,kind='money',min=0,max=Number.MAX_SAFE_INTEGER){let id='i-'+path.replaceAll('.','-'),str=v==null?'':(kind==='money'?money(v):String(v));return `<div class="field"><div class="input-row"><input id="${id}" data-path="${path}" data-kind="${kind}" data-min="${min}" data-max="${max}" type="text" inputmode="numeric" value="${str}" aria-label="${path}"><span class="unit">${unit}</span></div><small class="error" id="e-${id}"></small></div>`}
function productRows(){return state.products.map((p,i)=>{let sold=state.orders.filter(o=>o.productIndex===i||o.name===p.name).reduce((sum,o)=>sum+o.qty,0);return `<tr><td><input id="n-products-${i}-name" data-name="products.${i}.name" value="${esc(p.name)}" aria-label="Tên sản phẩm"><small class="note">Đã bán: ${money(sold)} phần</small></td><td>${input(p.price,`products.${i}.price`,'đ')}</td><td>${input(p.cost,`products.${i}.cost`,'đ/phần')}</td><td>${input(p.qty,`products.${i}.qty`,'phần','integer')}</td></tr>`}).join('')}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll("'",'&#39;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function metrics(c){if(!c)return `<div class="metrics">${['Doanh thu kế hoạch','Chi phí biến đổi','Chi phí cố định','Lợi nhuận dự kiến'].map(x=>`<div class="metric"><span>${x}</span><b>—</b></div>`).join('')}</div>`;return `<div class="metrics"><div class="metric"><span>Doanh thu kế hoạch</span><b>${money(c.revenue)} đ</b></div><div class="metric"><span>Chi phí biến đổi</span><b>${money(c.variable)} đ</b></div><div class="metric"><span>Chi phí cố định</span><b>${money(c.fixed)} đ</b></div><div class="metric"><span>Lợi nhuận dự kiến</span><b>${money(c.profit)} đ</b></div></div>`}
function renderProducts(){let sold=state.orders.reduce((s,o)=>s+o.revenue,0);document.querySelector('#products').innerHTML=`<div class="card"><div class="summary"><div><h2>Sản phẩm dự kiến</h2><p class="hint">Điền giá, chi phí và số phần dự kiến. Dữ liệu được tự lưu trên thiết bị này.</p></div><button class="secondary" id="reset">Nạp dữ liệu mẫu</button></div><div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th>Giá bán</th><th>Chi phí sản phẩm</th><th>Số lượng dự kiến</th></tr></thead><tbody>${productRows()}</tbody></table></div><div id="product-msg"></div></div><div class="card"><h2>Bán thử</h2><p class="hint">Doanh thu bán thử được theo dõi riêng, không cộng vào doanh thu kế hoạch.</p><div class="sales-form"><div><label>Sản phẩm<select id="order-product">${state.products.map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join('')}</select></label></div><div>${input('', 'order.qty','phần','integer',1)}</div><button id="save-order">Lưu đơn</button></div><p><b>Doanh thu bán thử: ${money(sold)} đ</b></p><div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th>Số lượng</th><th>Doanh thu đơn</th></tr></thead><tbody>${state.orders.length?state.orders.map(o=>`<tr><td>${esc(o.name)}</td><td>${money(o.qty)} phần</td><td>${money(o.revenue)} đ</td></tr>`).join(''):`<tr><td colspan="3" class="empty">Chưa có đơn bán thử.</td></tr>`}</tbody></table></div></div>`}
function renderCosts(){let c=calc();document.querySelector('#costs').innerHTML=`<div class="card"><h2>Chi phí cố định</h2><div class="table-wrap"><table><thead><tr><th>Khoản mục</th><th>Chi phí</th></tr></thead><tbody>${state.fixed.map((x,i)=>`<tr><td><input data-name="fixed.${i}.name" value="${esc(x.name)}" aria-label="Khoản mục"></td><td>${input(x.amount,`fixed.${i}.amount`,'đ')}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h2>Kế hoạch &amp; hòa vốn</h2>${metrics(c)}<p class="formula">Doanh thu KH = Σ giá × số phần; CP biến đổi = Σ chi phí/phần × số phần; Lợi nhuận = DT − CPBĐ − CPCĐ.</p><div class="break"><b>Lãi góp bình quân/phần: ${c&&c.avg!=null?money(c.avg)+' đ/phần':'Không xác định'}</b><br><b>Hòa vốn: ${c&&c.be!=null?money(c.be)+' phần':'Không xác định'}</b><br><span class="note">Hòa vốn = làm tròn lên (CP cố định / lãi góp bình quân). ${c&&(c.total===0||c.contrib<=0)?'Tổng số phần bằng 0 hoặc lãi góp không dương.':''}</span></div></div>`}
function roundHalfUp(n){return Math.floor(n+.5)}
function scenarioCard(s,i){let c=calc(), valid=Number.isFinite(s.visitors)&&Number.isFinite(s.rate)&&s.visitors>=0&&s.rate>=0&&s.rate<=100&&c&&c.total>0;let buyers=valid?roundHalfUp(s.visitors*s.rate/100):null;let rows=valid?state.products.map(p=>{let q=roundHalfUp(buyers*p.qty/c.total);return{...p,q}}):[];let total=rows.reduce((a,x)=>a+x.q,0), rev=rows.reduce((a,x)=>a+x.price*x.q,0),vari=rows.reduce((a,x)=>a+x.cost*x.q,0),fixed=c?c.fixed:null,profit=valid?rev-vari-fixed:null,contrib=rev-vari,avg=total>0?contrib/total:null,be=avg>0?Math.ceil(fixed/avg):null;return `<article class="scenario"><h3>${esc(s.name)}</h3><div class="table-wrap"><table><tbody><tr><td>Lượt khách</td><td>${input(s.visitors,`scenarios.${i}.visitors`,'khách','integer')}</td></tr><tr><td>Tỷ lệ mua</td><td>${input(s.rate,`scenarios.${i}.rate`,'%','integer',0,100)}</td></tr></tbody></table></div><p><b>Số khách mua: ${buyers==null?'—':money(buyers)+' khách'}</b><br><span class="note">Giả định 1 khách mua = 1 phần.</span></p><div class="table-wrap"><table><thead><tr><th>Sản phẩm</th><th>Phần phân bổ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${money(r.q)} phần</td></tr>`).join('')||'<tr><td colspan="2">—</td></tr>'}</tbody></table></div><p><b>Tổng phần sau làm tròn: ${valid?money(total)+' phần':'—'}</b>${valid&&total!==buyers?`<br><span class="note">Lệch ${money(total-buyers)} phần so với số khách mua do làm tròn từng sản phẩm.</span>`:''}</p><div class="metrics"><div class="metric"><span>Doanh thu</span><b>${valid?money(rev)+' đ':'—'}</b></div><div class="metric"><span>Chi phí biến đổi</span><b>${valid?money(vari)+' đ':'—'}</b></div><div class="metric"><span>Lợi nhuận</span><b>${valid?money(profit)+' đ':'—'}</b></div><div class="metric"><span>Hòa vốn</span><b>${be!=null?money(be)+' phần':'Không xác định'}</b></div></div></article>`}
function renderScenarios(){document.querySelector('#scenarios').innerHTML=`<div class="card"><h2>Kịch bản kinh doanh</h2><p class="formula">Số khách mua = làm tròn (khách × tỷ lệ%). Phần mỗi sản phẩm được làm tròn riêng theo cơ cấu số phần dự kiến.</p><div class="scenarios">${state.scenarios.map(scenarioCard).join('')}</div></div>`}
function scenarioData(s){let c=calc(),valid=!!(c&&c.total>0&&Number.isFinite(s.visitors)&&Number.isFinite(s.rate)&&s.visitors>=0&&s.rate>=0&&s.rate<=100);let buyers=valid?roundHalfUp(s.visitors*s.rate/100):null,rows=valid?state.products.map(p=>({...p,q:roundHalfUp(buyers*p.qty/c.total)})):[];let total=rows.reduce((sum,p)=>sum+p.q,0),revenue=rows.reduce((sum,p)=>sum+p.price*p.q,0),variable=rows.reduce((sum,p)=>sum+p.cost*p.q,0),contrib=revenue-variable,avg=total>0?contrib/total:null,be=avg>0?Math.ceil(c.fixed/avg):null;return{valid,buyers,rows,total,revenue,variable,fixed:c?c.fixed:null,profit:valid?revenue-variable-c.fixed:null,avg,be}}
function chartGroup(label,key,items,max){return `<div class="chart-group"><b>${label}</b><div class="chart-bars">${items.map(item=>{let n=item[key],pct=Math.min(50,Math.abs(n)/max*50),cls=n<0?'negative':'positive';return `<div class="bar-slot"><div class="bar-fill ${cls}" style="height:${pct}%" title="${esc(item.name)}: ${money(n)} đ"></div></div>`}).join('')}</div><p class="note">${items.map(item=>`${esc(item.name)}: ${money(item[key])} đ`).join(' · ')}</p><div class="legend"><span><i></i>${esc(items[0].name)}</span><span><i class="base"></i>${esc(items[1].name)}</span></div></div>`}
function renderOverview(){let c=calc(),soldRevenue=state.orders.reduce((sum,o)=>sum+o.revenue,0),soldQty=state.orders.reduce((sum,o)=>sum+o.qty,0),scenes=state.scenarios.map(s=>({...scenarioData(s),name:s.name})),max=Math.max(1,...scenes.flatMap(s=>[Math.abs(s.revenue||0),Math.abs((s.variable||0)+(s.fixed||0)),Math.abs(s.profit||0)]));let ranks=state.products.map((p,i)=>({name:p.name,per:p.price-p.cost,total:(p.price-p.cost)*p.qty,sold:state.orders.filter(o=>o.name===p.name).reduce((sum,o)=>sum+o.qty,0)})).sort((a,b)=>b.total-a.total);document.querySelector('#overview').innerHTML=`<div class="card"><h2>Tổng quan</h2><p class="hint">Doanh thu bán thử được theo dõi riêng, không cộng vào dự báo.</p><div class="metrics overview-metrics"><div class="metric"><span>Số phần dự kiến</span><b>${c?money(c.total)+' phần':'—'}</b></div><div class="metric"><span>Doanh thu dự kiến</span><b>${c?money(c.revenue)+' đ':'—'}</b></div><div class="metric"><span>Chi phí biến đổi</span><b>${c?money(c.variable)+' đ':'—'}</b></div><div class="metric"><span>Chi phí cố định</span><b>${c?money(c.fixed)+' đ':'—'}</b></div><div class="metric"><span>Lợi nhuận dự kiến</span><b>${c?money(c.profit)+' đ':'—'}</b></div><div class="metric"><span>Lãi góp bình quân</span><b>${c&&c.avg!=null?money(c.avg)+' đ/phần':'Không xác định'}</b></div><div class="metric"><span>Điểm hòa vốn</span><b>${c&&c.be!=null?money(c.be)+' phần':'Không xác định'}</b></div><div class="metric"><span>Đơn / phần bán thử</span><b>${money(state.orders.length)} đơn · ${money(soldQty)} phần</b></div><div class="metric"><span>Doanh thu bán thử</span><b>${money(soldRevenue)} đ</b></div></div></div><div class="card overview-section"><h2>So sánh kịch bản</h2><p class="hint">Cột vàng: Thận trọng · cột nâu: Cơ sở. Cột lợi nhuận âm hiển thị dưới đường giữa.</p><div class="chart-groups">${chartGroup('Doanh thu','revenue',scenes,max)}${chartGroup('Tổng chi phí','totalCost',scenes.map(s=>({...s,totalCost:(s.variable||0)+(s.fixed||0)})),max)}${chartGroup('Lợi nhuận','profit',scenes,max)}</div></div><div class="card overview-section"><h2>Xếp hạng sản phẩm</h2><p class="hint">Sắp xếp theo tổng lãi góp dự kiến = (giá bán − chi phí/phần) × số phần dự kiến.</p><div class="table-wrap"><table class="ranking-table"><thead><tr><th>Hạng</th><th>Sản phẩm</th><th>Lãi góp/phần</th><th>Tổng lãi góp dự kiến</th><th>Đã bán thử</th></tr></thead><tbody>${ranks.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${money(r.per)} đ/phần</td><td>${money(r.total)} đ</td><td>${money(r.sold)} phần</td></tr>`).join('')}</tbody></table></div></div>`}
function render(){renderOverview();renderProducts();renderCosts();renderScenarios();validateAll()}
function getPath(path){let a=path.split('.'),o=state;for(let i=0;i<a.length-1;i++)o=o[a[i]];return[o,a.at(-1)]}
function groupDigits(digits){let clean=digits.replace(/^0+(?=\d)/,'');return clean.replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function formatInput(el){let raw=el.value, caret=el.selectionStart||0, digitsBefore=(raw.slice(0,caret).match(/\d/g)||[]).length, digits=raw.replace(/\D/g,'');el.value=digits?groupDigits(digits):'';let pos=0,count=0;while(pos<el.value.length&&count<digitsBefore){if(/\d/.test(el.value[pos]))count++;pos++}el.setSelectionRange(pos,pos)}
function setError(el,msg){el.classList.toggle('invalid',!!msg);let box=document.getElementById('e-'+el.id);if(box)box.textContent=msg||''}
function validate(el,commit=true,typedInvalid=''){let path=el.dataset.path, kind=el.dataset.kind, min=Number(el.dataset.min),max=Number(el.dataset.max);if(kind==='money')formatInput(el);let raw=el.value.replace(/\D/g,''), invalid=typedInvalid||(!raw?'Không được để trống.':'');let n=raw===''?null:Number(raw);if(n!==null&&!Number.isSafeInteger(n))invalid='Số quá lớn, vui lòng nhập tối đa 15 chữ số.';else if(n!==null&&(n<min||n>max))invalid=kind==='integer'&&max===100?'Tỷ lệ phải từ 0 đến 100.':`Giá trị phải từ ${min} đến ${money(max)}.`;setError(el,invalid);if(path==='order.qty')return !invalid;if(!invalid&&commit){let[o,k]=getPath(path);o[k]=n;lastValid[path]=n;save()}else if(invalid&&commit){let[o,k]=getPath(path);if(lastValid[path]!==undefined)o[k]=lastValid[path]}return !invalid}
function validateAll(){document.querySelectorAll('[data-path]').forEach(el=>{if(el.dataset.path==='order.qty')return;let[o,k]=getPath(el.dataset.path);lastValid[el.dataset.path]=o[k];if(el.value!=='')validate(el,false)}); state.products.forEach((p,i)=>{let box=document.querySelector('#product-msg');if(box&&Number.isFinite(p.price)&&Number.isFinite(p.cost)&&p.price<p.cost)box.innerHTML='<span class="warning">Cảnh báo: có giá bán thấp hơn chi phí sản phẩm.</span>'})}
function toast(msg,error=false){let t=document.querySelector('#toast');t.textContent=msg;t.className='toast show'+(error?' error':'');setTimeout(()=>t.className='toast',2800)}
document.addEventListener('click',e=>{let tab=e.target.closest('.tab');if(tab){document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));tab.classList.add('active');document.getElementById(tab.dataset.tab).classList.add('active')}if(e.target.id==='reset'){if(confirm('Nạp lại dữ liệu mẫu? Toàn bộ thay đổi, gồm đơn bán thử, sẽ bị thay thế.')){state=sample();lastValid={};save();render();toast('Đã nạp lại dữ liệu mẫu.')}}if(e.target.id==='save-order'){let q=document.querySelector('#i-order-qty');if(!validate(q))return;let i=Number(document.querySelector('#order-product').value),p=state.products[i];if(!p||!Number.isFinite(p.price)){toast('Sản phẩm chưa có giá bán hợp lệ.',true);return}state.orders.push({name:p.name,qty:Number(q.value.replace(/\D/g,'')),revenue:p.price*Number(q.value.replace(/\D/g,''))});save();renderProducts();toast('Đã lưu đơn bán thử.')}});
document.addEventListener('click',e=>{if(e.target.id==='save-order')setTimeout(renderOverview,0)});
function rerenderKeepingCursor(){let a=document.activeElement,id=a&&a.id,sel=a&&a.selectionStart,digits=a&&a.value?(a.value.slice(0,sel).match(/\d/g)||[]).length:0;render();let next=id&&document.getElementById(id);if(next){next.focus();if(next.dataset.kind==='money'){let p=0,c=0;while(p<next.value.length&&c<digits){if(/\d/.test(next.value[p]))c++;p++}next.setSelectionRange(p,p)}else next.setSelectionRange(Math.min(sel,next.value.length),Math.min(sel,next.value.length))}}
document.addEventListener('input',e=>{if(e.target.matches('[data-path]')){let original=e.target.value,typedInvalid=/[^\d.]/.test(original)?'Chỉ được nhập chữ số.':'';if(e.target.dataset.kind==='money')formatInput(e.target);else{let old=e.target.value,at=e.target.selectionStart||0,before=(old.slice(0,at).match(/\d/g)||[]).length;e.target.value=old.replace(/\D/g,'');e.target.setSelectionRange(before,before);if(/\D/.test(original))typedInvalid='Chỉ được nhập số nguyên.'}let ok=validate(e.target,true,typedInvalid);if(ok&&e.target.dataset.path!=='order.qty')rerenderKeepingCursor()}if(e.target.matches('[data-name]')){let[o,k]=getPath(e.target.dataset.name);o[k]=e.target.value;save();rerenderKeepingCursor()}});
render();
</script></body></html>
